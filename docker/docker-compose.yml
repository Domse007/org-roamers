services:
  org-roamers:
    image: ghcr.io/domse007/org-roamers:latest
    container_name: org-roamers
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Mount your org-roam directory (REQUIRED - edit this path!)
      - ~/org-roam:/data:ro

      # Mount config file (REQUIRED - edit this path!)
      # Generate it first with: docker run --rm ghcr.io/domse007/org-roamers:latest /app/org-roamers-cli get-config > config.json
      - ./config.json:/config/conf.json:ro
    environment:
      # Override config file location if needed
      CONFIG_FILE: /config/conf.json
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
